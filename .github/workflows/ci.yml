name: Server CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: hopin_test
          POSTGRES_PASSWORD: hopin_test
          POSTGRES_DB: hopin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hopin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: hopin_test
      DB_PASSWORD: hopin_test
      DB_NAME: hopin_test
      DB_SYNCHRONIZE: 'true'
      DB_LOGGING: 'false'
      JWT_ACCESS_SECRET: ci_access_secret
      JWT_REFRESH_SECRET: ci_refresh_secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      REFRESH_TOKEN_TTL_DAYS: '7'
      LANGFUSE_ENABLED: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check / build
        run: npm run build

      - name: Test
        run: npm test
