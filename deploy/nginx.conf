server {
    listen 80;
    listen [::]:80;
    server_name hopIn.cs.colman.ac.il;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hopIn.cs.colman.ac.il;

    ssl_certificate     /etc/ssl/cs/CSB.crt;
    ssl_certificate_key /etc/ssl/cs/myserver.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    # --- API ---
    # /api/foo -> http://127.0.0.1:3000/foo
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Client (SPA) ---
    root /var/www/hopin-client;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Long-cache hashed static assets that Vite emits under /assets
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
